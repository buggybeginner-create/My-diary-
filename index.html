<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Diary">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#c9d0cb" id="themeColor">
<title>My Diary</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%93%3C/text%3E%3C/svg%3E">
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"New York",ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pitch:34px;
  --desk:#c9d0cb; --paper:#fdfcf9; --line:#cddbec; --margin:#e9a3a3;
  --ink:#1c2a48; --muted:#7f88a0; --accent:#2547a6; --accent-ink:#ffffff; --accent-soft:#e2eafb;
  --btn:rgba(255,255,255,.9); --bar:rgba(232,237,234,.84); --hl:#fff0a0; --danger:#c0392b;
  --shadow:0 1px 2px rgba(20,30,50,.14),0 16px 44px rgba(20,30,50,.18);
}
:root[data-theme="dark"]{
  --desk:#0f1114; --paper:#1d2027; --line:#2b3242; --margin:#7d3d48;
  --ink:#ece9e2; --muted:#8e97aa; --accent:#8fb0ff; --accent-ink:#0f1524; --accent-soft:#27324e;
  --btn:rgba(44,49,60,.92); --bar:rgba(20,22,27,.86); --hl:#5a4d16; --danger:#ff8a7a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font-family:var(--sans);touch-action:manipulation;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);padding-top:env(safe-area-inset-top);border-bottom:1px solid rgba(0,0,0,.07)}
#toolbar{display:flex;gap:8px;padding:8px 12px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
#toolbar>:first-child{margin-left:auto}#toolbar>:last-child{margin-right:auto}
#toolbar::-webkit-scrollbar{display:none}
.tb{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:48px;height:48px;padding:0 15px;border:0;border-radius:16px;background:var(--btn);font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tb .e{font-size:20px;line-height:1}
.tb.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.tb.primary{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tb:disabled{opacity:.35;cursor:default}
.tb:not(:disabled):active{transform:scale(.96)}
#penbar{display:none;gap:8px 12px;padding:0 12px 10px;justify-content:center;align-items:center;flex-wrap:wrap}
body.pen #penbar{display:flex}
.pl{font-weight:600;font-size:14px;color:var(--muted)}
.grp{display:inline-flex;align-items:center;gap:2px}
.sw{width:42px;height:42px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}
.sw i{display:block;width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(128,128,128,.35)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--accent)}
.sz i{background:var(--ink);width:var(--d);height:var(--d)}
.chipb{height:42px;padding:0 14px;border-radius:14px;border:0;background:var(--btn);font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* ---------- desk & navigation ---------- */
#desk{max-width:1240px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
#nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#nav .sp{flex:1}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:0;border-radius:14px;background:var(--btn);font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.now{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.danger{background:var(--danger);color:#fff;box-shadow:none}
.btn input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer;font-size:16px}
#chips{display:flex;gap:8px;align-items:center;margin:-2px 0 12px;font-size:14px;color:var(--muted);font-weight:600}
.chip{min-width:40px;height:36px;border-radius:12px;border:0;background:var(--btn);font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}

/* ---------- the paper ---------- */
#sheet{position:relative;display:flex;flex-direction:column;background:var(--paper);border-radius:10px 22px 22px 10px;box-shadow:var(--shadow);overflow:hidden}
body.pen #sheet{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.holes{position:absolute;left:14px;top:0;bottom:0;width:26px;pointer-events:none;
  background:radial-gradient(circle at 13px 13px,var(--desk) 0 8px,rgba(0,0,0,.2) 9px,transparent 11px) 0 64px/26px 190px repeat-y}
.margin{position:absolute;left:70px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.75;pointer-events:none}
.shead{padding:30px 28px 16px 84px}
.sh-title{font:600 15px var(--sans);color:var(--muted)}
.sh-dl{font:italic 17px var(--serif);color:var(--muted);margin-top:16px}
.sh-date{font:700 34px/1.18 var(--serif);letter-spacing:-.01em;margin-top:2px}
.sbody{flex:1;position:relative;padding:0 28px 68px 84px;
  background:linear-gradient(to bottom,transparent 33px,var(--line) 33px,var(--line) 34px) 0 0/100% 34px repeat-y}
.blk{border-radius:6px}
.blk textarea{display:block;width:100%;height:34px;margin:0;padding:0;border:0;outline:0;background:transparent;color:var(--ink);
  font:400 20px/34px var(--serif);resize:none;overflow:hidden;border-radius:0;-webkit-appearance:none;appearance:none;caret-color:var(--accent)}
.blk textarea::placeholder{color:var(--muted);opacity:.7}
.task{display:flex;align-items:flex-start;gap:14px}
.chk{flex:none;position:relative;width:44px;height:44px;margin:-5px -9px -5px -9px;padding:0;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.chk svg{display:block;transition:transform .15s}
.chk:active svg{transform:scale(.88)}
.chk .box{fill:transparent;stroke:currentColor;stroke-width:2;transition:fill .2s,stroke .2s}
.chk .tick{fill:none;stroke:var(--accent-ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .06s}
.task.done .chk .box{fill:var(--accent);stroke:var(--accent)}
.task.done .chk .tick{stroke-dashoffset:0}
.task .tt{text-decoration-line:line-through;text-decoration-color:transparent;text-decoration-thickness:2px;transition:color .3s,text-decoration-color .3s}
.task.done .tt{color:var(--muted);text-decoration-color:currentColor}
.acts{flex:none;display:flex;margin:-3px -8px -3px 0;opacity:.55;transition:opacity .2s}
.task:hover .acts,.task:focus-within .acts{opacity:1}
.ic{width:40px;height:40px;border:0;border-radius:12px;background:transparent;font-size:17px;color:var(--muted);display:grid;place-items:center;padding:0}
.ic:hover,.ic:active{background:var(--accent-soft);color:var(--ink)}
#completed{margin-top:34px}
#completed h3{margin:0;font:600 17px/34px var(--sans);color:var(--muted)}
.flash{animation:flash 1.7s ease}
@keyframes flash{0%,55%{background:var(--hl)}100%{background:transparent}}

/* handwriting layer: only captures input in Pen mode */
#ink{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;touch-action:none;pointer-events:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.inkon #ink{pointer-events:auto;cursor:crosshair}
body.inkon .blk textarea,body.inkon .chk,body.inkon .acts,body.inkon .who{pointer-events:none}
#ring{position:fixed;left:0;top:0;border:2px solid var(--accent);border-radius:50%;background:rgba(90,130,255,.1);pointer-events:none;z-index:40}
#bSpace{width:100%;margin-top:14px}

/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 6vh) 12px 12px}
.scrim{position:absolute;inset:0;background:rgba(12,16,26,.45)}
.panel{position:relative;width:min(640px,100%);max-height:84vh;overflow:auto;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:18px;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.panel h2{font:700 24px var(--serif);margin:2px 4px 12px}
.msg{margin:0 4px 16px;color:var(--muted);font-size:16px}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 14px;border:0;background:transparent;font:600 17px var(--sans);text-align:left;border-radius:14px}
.mi span{width:28px;text-align:center;font-size:21px}
.mi:hover,.mi:active{background:var(--accent-soft)}
.mi.danger{color:var(--danger)}
.qin{width:100%;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:18px var(--sans);padding:0 16px;outline:0;-webkit-appearance:none;appearance:none}
.qin:focus{border-color:var(--accent)}
.results{margin-top:10px}
.rh{margin:10px 6px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.res{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:14px;font:16px/1.4 var(--serif)}
.res:hover,.res:active{background:var(--accent-soft)}
.res b{font-family:var(--sans);font-weight:700}
.res .mk{font-family:var(--sans)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.hint,.empty{color:var(--muted);font-size:14px;margin:12px 6px 0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;background:#1d2534;color:#fff;
  padding:12px 18px;border-radius:16px;display:flex;gap:16px;align-items:center;font:600 15px var(--sans);max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .2s ease-out}
#toast button{background:none;border:0;color:#a9c0ff;font:700 15px var(--sans);min-height:34px;padding:0 4px}

/* ---------- segmented control, handwriting-to-text pad ---------- */
.seg{display:inline-flex;background:var(--btn);border-radius:14px;padding:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
body.padopen #colors,body.padopen #sizes,body.padopen #bClear{display:none}
body.padopen #desk{padding-bottom:calc(env(safe-area-inset-bottom) + 470px)}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.padcard{pointer-events:auto;max-width:960px;margin:0 auto;background:var(--paper);border-radius:22px;box-shadow:0 -6px 30px rgba(0,0,0,.25),0 0 0 2px var(--accent);padding:12px}
.padtop{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.padtop b{font:700 18px var(--serif)}
.padtop .sp{flex:1}
.padtop select{height:40px;border-radius:12px;border:0;background:var(--btn);color:var(--ink);font:600 14px var(--sans);padding:0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.padwrap{position:relative;height:clamp(120px,24vh,280px);border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);background:var(--paper);overflow:hidden}
#padCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.padline{position:absolute;left:14px;right:14px;top:66%;border-top:2px dashed var(--line);pointer-events:none}
.padhint{position:absolute;left:0;right:0;top:34%;text-align:center;color:var(--muted);font:italic 18px var(--serif);pointer-events:none}
#recText{display:block;width:100%;min-height:58px;margin-top:10px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:400 20px/1.4 var(--serif);resize:vertical;outline:0}
#recText:focus{border-color:var(--accent)}
.padstat{min-height:22px;margin:6px 4px 8px;font-size:14px;color:var(--muted)}
.padbtns{display:flex;gap:8px;flex-wrap:wrap}
.padbtns .sp{flex:1}

/* ---------- summary ---------- */
#sumhead{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px 10px;max-width:1100px;margin:0 auto}
#sumhead .sp{flex:1}
body.sumview #sumhead{display:flex}
body.sumview #toolbar,body.sumview #penbar,body.sumview #desk,body.sumview #pad{display:none}
#summary{max-width:1100px;margin:0 auto;padding:14px 14px calc(60px + env(safe-area-inset-bottom))}
.sumfil{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.dl{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.dl input,.qin.sm{height:44px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:16px var(--sans);padding:0 10px}
.qin.sm{width:min(100%,260px);font-size:16px}
.sumstats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.stat{padding:10px 14px;border-radius:14px;background:var(--btn);font-size:15px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.stat b{font:700 20px var(--serif)}
.stat.per{color:var(--muted)}
.days{display:grid;gap:14px}
.tw{overflow-x:auto;margin-top:8px}
table.jt{width:100%;border-collapse:collapse;font:15px/1.35 var(--sans)}
table.jt th{position:sticky;top:0;text-align:left;font:600 13px var(--sans);color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
table.jt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.jt td.c0{width:44px;padding:4px 0 4px 6px}
table.jt th.num,table.jt td.num{text-align:center;white-space:nowrap}
table.jt td.dsc{font:17px/1.35 var(--serif);min-width:190px;word-break:break-word}
table.jt small{display:block;color:var(--muted);font-size:12px}
table.jt tr.done td.dsc .jl,table.jt tr.done td.dsc>span{text-decoration:line-through;color:var(--muted)}
table.jt tr.old td.num{color:var(--danger);font-weight:700}
.bdg{display:inline-block;padding:3px 10px;border-radius:999px;font:600 13px var(--sans);white-space:nowrap}
.bdg.ok{background:#dff3e6;color:#17623b}
.bdg.pe{background:#fdebd2;color:#8a4b00}
:root[data-theme="dark"] .bdg.ok{background:#1f4a33;color:#9be3bb}
:root[data-theme="dark"] .bdg.pe{background:#57411a;color:#ffd18b}
button.cb{cursor:pointer;width:36px;height:36px;border:0;background:transparent;font-size:26px;line-height:36px;padding:0;color:var(--accent);text-align:center}
.selx{height:44px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px var(--sans);padding:0 10px;max-width:200px}
.who{flex:none;align-self:flex-start;margin-top:4px;height:26px;max-width:120px;padding:0 10px;border:0;border-radius:13px;background:var(--accent-soft);color:var(--accent);font:600 13px/26px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who:empty{display:none}
.task.haswho .whoic{display:none}
.whochips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip.nm{padding:0 14px}
@media (max-width:760px){
  table.jt,table.jt tbody,table.jt tr,table.jt td{display:block;width:auto}
  table.jt thead{display:none}
  table.jt tr{padding:8px 0;border-bottom:1px solid var(--line)}
  table.jt td{border:0;padding:2px 4px}
  table.jt td.c0{float:left;width:40px;padding:0}
  table.jt td.dsc{min-width:0;margin-left:0}
  table.jt td[data-l]:not(.dsc):not(.c0)::before{content:attr(data-l) ": ";color:var(--muted);font:600 12px var(--sans)}
  table.jt th.num,table.jt td.num{text-align:left}
  .who{max-width:90px}
  .rep .rt{display:none}
  .rep{padding:0 8px}
  table.jt tr.det{border:0}
  table.jt table.sub,table.jt table.sub tbody,table.jt table.sub tr{display:table;width:100%}
  table.jt table.sub tbody{display:table-row-group}
  table.jt table.sub tr{display:table-row}
}
.card{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.card h3{margin:0;font:700 20px/1.25 var(--serif)}
.cnt{font:500 14px var(--sans);color:var(--muted)}
.sec{font:600 14px var(--sans);color:var(--muted);margin:12px 0 2px}
.job{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.job .cb{flex:none;width:34px;height:34px;margin:-3px 0 -3px -6px;border:0;background:transparent;font-size:26px;line-height:34px;text-align:center;color:var(--accent);padding:0}
button.cb{border-radius:10px}
.jl{border:0;background:transparent;padding:0;text-align:left;font:inherit;color:inherit}
.jt{flex:1;min-width:0;font:17px/1.35 var(--serif);word-break:break-word}
.jm{display:block;font:13px/1.4 var(--sans);color:var(--muted);margin-top:2px}
.job.done .jt .jl,.job.done .jt>span:first-child{text-decoration:line-through;color:var(--muted)}
.job.old .jm{color:var(--danger);font-weight:600}

/* ---------- save state & backup dialog ---------- */
.pill{min-height:36px;padding:0 13px;border:0;border-radius:18px;background:var(--btn);font:600 13px var(--sans);color:var(--muted);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);max-width:100%}
.pill.warn{background:#fdebd2;color:#8a4b00}
:root[data-theme="dark"] .pill.warn{background:#57411a;color:#ffd18b}
.set{margin:0 4px 16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.set>b{font:700 17px var(--sans)}
.set .msg{margin:4px 0 10px}
.set .btns{justify-content:flex-start;align-items:center}
.steps{margin:0 4px 14px;padding-left:22px;line-height:1.6}

/* ---------- pending-from-earlier panel, repeat ---------- */
#carry{margin:0 0 12px}
.carrycard{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:10px 14px 6px}
.carryhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.carryhead b{font:700 17px var(--serif);flex:1;min-width:150px}
.carryhead .btn{min-height:40px;padding:0 12px;font-size:14px}
.carrylist{max-height:min(44vh,420px);overflow:auto;margin-top:6px}
.cr{display:flex;gap:6px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.cr.hid{opacity:.6}
.cm{flex:1;min-width:0}
.cin{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);font:17px/1.4 var(--serif);padding:2px 0;outline:0;border-radius:0}
.cin:focus{border-bottom-color:var(--accent)}
.cmeta{font:13px/1.45 var(--sans);color:var(--muted);margin-top:3px}
.cr.old .cmeta .age{color:var(--danger);font-weight:600}
.cact{display:flex;flex:none;margin-right:-6px}
.cwho{border:0;background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:0 8px;font:600 12px/22px var(--sans)}
.carrybar{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:6px 8px 6px 16px;font-weight:600;font-size:15px}
.carrybar span{flex:1}
.rep{flex:none;align-self:flex-start;margin-top:4px;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--muted);font:600 12px/24px var(--sans);white-space:nowrap}
.task:not(.isrep) .rep{display:none}

<script>
(() => {
'use strict';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); };
const longDate = s => { const d = parseISO(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const shortDate = s => { const d = parseISO(s); const y = d.getFullYear() === new Date().getFullYear() ? '' : ' ' + d.getFullYear(); return `${d.getDate()} ${MON[d.getMonth()]}${y}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const animOK = () => !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   Settings (localStorage — small things only)
   ===================================================================== */
const SKEY = 'paper-diary-settings-v1';
const COLORS = ['auto', 'blue', 'red', 'green'];
const SIZES = [2.4, 3.8, 6.5];      // pen widths in page units (page is 1000 units wide)
const ERAS = [14, 24, 42];          // eraser radii in page units
const S = Object.assign({ theme: null, fingerDraw: true, fingerSet: false, color: 'auto', size: 1, penMode: 'ink', carryHidden: false, lang: 'en', onlineOK: false, autoSave: true, autoBackup: true, lastBackup: 0, hadData: false }, (() => {
  try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; }
})());
const saveSettings = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };

const PAL = {
  light: { auto: '#1c2a48', blue: '#2446c8', red: '#c42b2b', green: '#1b7f52' },
  dark:  { auto: '#ece9e2', blue: '#7c9bff', red: '#ff7d7d', green: '#5fd79b' }
};
const themeName = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
const inkColor = k => (PAL[themeName()][k] || PAL.light.auto);

/* =====================================================================
   Storage: IndexedDB (fallback to localStorage)
   ===================================================================== */
const Store = {
  kind: 'idb', db: null, mem: {},
  async init() {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await Promise.race([new Promise((res, rej) => {
        const r = indexedDB.open('paper-diary', 2);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('pages')) d.createObjectStore('pages', { keyPath: 'id' }); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('idb error'));
        r.onblocked = () => rej(new Error('idb blocked'));
      }), new Promise((_, rej) => setTimeout(() => rej(new Error('idb timeout')), 2500))]);
    } catch (e) {
      this.kind = 'ls';
      try { this.mem = JSON.parse(localStorage.getItem('paper-diary-pages') || '{}') || {}; } catch (_) { this.mem = {}; }
    }
  },
  os(mode) { return this.db.transaction('pages', mode).objectStore('pages'); },
  wrap(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  lsFlush() { try { localStorage.setItem('paper-diary-pages', JSON.stringify(this.mem)); } catch (e) { this.lsFail = true; } },
  async getMeta(k) { if (this.kind !== 'idb') return null; const r = await this.wrap(this.db.transaction('meta', 'readonly').objectStore('meta').get(k)); return r ? r.v : null; },
  async setMeta(k, v) { if (this.kind === 'idb') return this.wrap(this.db.transaction('meta', 'readwrite').objectStore('meta').put({ k, v })); },
  async delMeta(k) { if (this.kind === 'idb') return this.wrap(this.db.transaction('meta', 'readwrite').objectStore('meta').delete(k)); },
  async all() { return this.kind === 'idb' ? this.wrap(this.os('readonly').getAll()) : Object.values(this.mem); },
  async put(p) {
    if (this.kind === 'idb') return this.wrap(this.os('readwrite').put(p));
    this.mem[p.id] = JSON.parse(JSON.stringify(p)); this.lsFlush();
  },
  async del(id) {
    if (this.kind === 'idb') return this.wrap(this.os('readwrite').delete(id));
    delete this.mem[id]; this.lsFlush();
  },
  async clear() {
    if (this.kind === 'idb') return this.wrap(this.os('readwrite').clear());
    this.mem = {}; this.lsFlush();
  }
};

/* =====================================================================
   Data model
   page = { id, date:'YYYY-MM-DD', created, updated, h, blocks:[{id,type:'text'|'task',text,done?,doneAt?}], strokes:[{c,w,p:[x,y,x,y…]}] }
   ===================================================================== */
const pages = new Map();     // persisted pages
let cur = null;              // page on screen (may be an untouched blank that isn't stored yet)
let mode = 'text';           // 'text' | 'pen'
let tool = 'pen';            // 'pen' | 'eraser' (used in pen mode)
let lastFocusId = null;

const newPage = date => ({ id: uid(), date, created: Date.now(), updated: Date.now(), h: 1500,
  blocks: [{ id: uid(), type: 'text', text: '' }], strokes: [] });
const pagesOn = date => [...pages.values()].filter(p => p.date === date).sort((a, b) => a.created - b.created);
const getBlock = id => cur && cur.blocks.find(b => b.id === id);
const isBlank = p => !p.strokes.length && p.blocks.every(b => b.type === 'text' && !b.text.trim());

function sanitizePage(p) {
  if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(p.date || '')) return null;
  const seen = new Set();
  const blocks = [];
  (Array.isArray(p.blocks) ? p.blocks : []).forEach(b => {
    if (!b || typeof b !== 'object') return;
    let id = String(b.id || uid()); if (seen.has(id)) id = uid(); seen.add(id);
    if (b.type === 'task') {
      const o = { id, type: 'task', text: String(b.text == null ? '' : b.text), done: !!b.done };
      if (o.done) o.doneAt = Number(b.doneAt) || 0;
      if (Number(b.at)) o.at = Number(b.at);
      const w = String(b.who || '').trim().slice(0, 40); if (w) o.who = w;
      if (typeof b.rid === 'string' && b.rid) { o.rid = b.rid.slice(0, 40); if (/^\d{4}-\d{2}-\d{2}$/.test(b.occ || '')) o.occ = b.occ; }
      if (b.hid) o.hid = true;
      blocks.push(o);
    } else blocks.push({ id, type: 'text', text: String(b.text == null ? '' : b.text) });
  });
  const strokes = [];
  (Array.isArray(p.strokes) ? p.strokes : []).forEach(s => {
    if (!s || !Array.isArray(s.p)) return;
    let pts = s.p.map(Number).filter(Number.isFinite);
    if (pts.length % 2) pts = pts.slice(0, -1);
    if (pts.length < 2) return;
    strokes.push({ c: COLORS.includes(s.c) ? s.c : 'auto', w: clamp(Number(s.w) || 3.8, 0.5, 30), p: pts });
  });
  return { id: p.id, date: p.date, created: Number(p.created) || Date.now(), updated: Number(p.updated) || Date.now(),
    h: clamp(Number(p.h) || 1500, 800, 6000), blocks, strokes };
}

/* =====================================================================
   Repeating jobs (rules)
   ===================================================================== */
const rules = new Map();
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const isDate = x => /^\d{4}-\d{2}-\d{2}$/.test(x || '');
function sanitizeRule(r) {
  if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !isDate(r.start)) return null;
  return { id: r.id, text: String(r.text || '').slice(0, 300), who: String(r.who || '').slice(0, 40),
    type: ['daily', 'weekly', 'monthly', 'yearly'].includes(r.type) ? r.type : 'weekly', every: clamp(parseInt(r.every) || 1, 1, 99),
    days: (Array.isArray(r.days) ? r.days : []).map(Number).filter(n => n >= 0 && n <= 6), start: r.start, since: isDate(r.since) ? r.since : r.start,
    end: isDate(r.end) ? r.end : '', active: r.active !== false, gen: isDate(r.gen) ? r.gen : '',
    skip: (Array.isArray(r.skip) ? r.skip : []).filter(isDate).slice(-500), created: Number(r.created) || Date.now(), updated: Number(r.updated) || Date.now() };
}
async function loadRules() {
  let arr = null;
  try { arr = await Store.getMeta('rules'); } catch (_) {}
  if (!arr) { try { arr = JSON.parse(localStorage.getItem('paper-diary-rules') || 'null'); } catch (_) {} }
  (Array.isArray(arr) ? arr : []).map(sanitizeRule).filter(Boolean).forEach(r => rules.set(r.id, r));
}
function saveRules() {
  const arr = [...rules.values()];
  try { localStorage.setItem('paper-diary-rules', JSON.stringify(arr)); } catch (_) {}
  Store.setMeta('rules', arr).catch(() => {});
}
function mergeRules(list) {
  let changed = false;
  (list || []).forEach(r => { const l = rules.get(r.id); if (!l || r.updated > l.updated) { rules.set(r.id, r); changed = true; } });
  if (changed) saveRules();
  return changed;
}
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
function mondayOf(s) { const d = parseISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); }
function occursOn(r, date) {
  if (date < r.start || (r.end && date > r.end)) return false;
  const d = parseISO(date), st = parseISO(r.start), n = r.every || 1;
  if (r.type === 'daily') return dd(r.start, date) % n === 0;
  if (r.type === 'weekly') {
    const days = r.days.length ? r.days : [st.getDay()];
    return Math.floor(dd(mondayOf(r.start), date) / 7) % n === 0 && days.includes(d.getDay());
  }
  const last = Math.min(st.getDate(), dim(d.getFullYear(), d.getMonth()));
  if (r.type === 'monthly') return ((d.getFullYear() - st.getFullYear()) * 12 + d.getMonth() - st.getMonth()) % n === 0 && d.getDate() === last;
  return (d.getFullYear() - st.getFullYear()) % n === 0 && d.getMonth() === st.getMonth() && d.getDate() === last;
}
function occDates(r, from, to) {
  const out = []; let d = from > r.start ? from : r.start;
  for (let i = 0; i < 4000 && d <= to; i++) { if (occursOn(r, d) && !r.skip.includes(d)) out.push(d); d = addDays(d, 1); }
  return out;
}
function nextDates(r, from, k) {
  const out = []; let d = from > r.start ? from : r.start;
  for (let i = 0; i < 4000 && out.length < k; i++) { if (occursOn(r, d) && !r.skip.includes(d)) out.push(d); d = addDays(d, 1); }
  return out;
}
function perYear(r) {
  const n = r.every || 1;
  const v = r.type === 'daily' ? 365 / n : r.type === 'weekly' ? 52 / n * (r.days.length || 1) : r.type === 'monthly' ? 12 / n : 1 / n;
  return Math.round(v * 10) / 10;
}
function ruleDesc(r) {
  const n = r.every || 1, st = parseISO(r.start);
  let t;
  if (r.type === 'daily') t = n === 1 ? 'Every day' : `Every ${n} days`;
  else if (r.type === 'weekly') t = (n === 1 ? 'Every week' : `Every ${n} weeks`) + ' on ' + (r.days.length ? r.days : [st.getDay()]).slice().sort().map(i => DOW[i]).join(', ');
  else if (r.type === 'monthly') t = (n === 1 ? 'Every month' : `Every ${n} months`) + ` on day ${st.getDate()}`;
  else t = (n === 1 ? 'Every year' : `Every ${n} years`) + ` on ${st.getDate()} ${MON[st.getMonth()]}`;

/* =====================================================================
   Search
   ===================================================================== */
function snippet(text, tk) {
  const t = text.replace(/\s+/g, ' ').trim(), lt = t.toLowerCase();
  let idx = 0;
  for (const k of tk) { const i = lt.indexOf(k); if (i >= 0) { idx = i; break; } }
  const start = Math.max(0, idx - 32);
  let raw = t.slice(start, start + 110);
  if (start > 0) raw = '…' + raw;
  if (start + 110 < t.length) raw += '…';
  const re = new RegExp(tk.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
  return esc(raw.replace(re, m => '\u0001' + m + '\u0002')).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
}
const previewOf = p => {
  const b = p.blocks.find(x => x.text.trim());
  return b ? esc(b.text.replace(/\s+/g, ' ').trim().slice(0, 80)) : (p.strokes.length ? '✍️ Handwriting' : 'Empty page');
};
function resRow(p, bid, mk, html) {
  return `<button class="res" type="button" data-page="${p.id}" data-block="${bid || ''}"><b>${esc(shortDate(p.date))}</b> — ${mk ? `<span class="mk">${mk}</span> ` : ''}<span>${html}</span></button>`;
}
function dateKeys(p) {
  const d = parseISO(p.date);
  return [p.date, `${d.getDate()} ${MON[d.getMonth()]}`, `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`,
    longDate(p.date), `${MONTHS[d.getMonth()]} ${d.getFullYear()}`].join(' | ').toLowerCase();
}
function searchHTML(qs) {
  const tk = qs.toLowerCase().split(/\s+/).filter(Boolean);
  const list = [...pages.values()].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.created - a.created);
  const rows = [];
  if (!tk.length) {
    list.slice(0, 12).forEach(p => rows.push(resRow(p, '', '', previewOf(p))));
    return rows.length ? '<div class="rh">Recent pages</div>' + rows.join('') : '<p class="empty">No pages yet. Write something and it will show up here.</p>';
  }
  for (const p of list) {
    if (rows.length >= 80) break;
    if (tk.every(k => dateKeys(p).includes(k))) rows.push(resRow(p, '', '📅', esc(longDate(p.date)) + ' · ' + previewOf(p)));
    for (const b of p.blocks) {
      const lt = (b.text + ' ' + (b.who || '')).toLowerCase();
      if (b.text.trim() && tk.every(k => lt.includes(k))) rows.push(resRow(p, b.id, b.type === 'task' ? (b.done ? '☑' : '☐') : '', snippet(b.text, tk)));
    }
  }
  return rows.length ? rows.join('') : `<p class="empty">No matches for “${esc(qs)}”.</p>`;
}
function openSearch() {
  begin();

function fmtAgo(ts) {

}
let lastBkRules = [];
async function readBackupList() {
  const f = await bkHandle.getFile(), t = await f.text();

  const j = JSON.parse(t);
  lastBkRules = (Array.isArray(j) ? [] : j.rules || []).map(sanitizeRule).filter(Boolean);
  return (Array.isArray(j) ? j : j.pages || []).map(sanitizePage).filter(Boolean);
}
async function bkWriteNow() {

  try {
    const merged = new Map(pages), mr = new Map(rules);      // never lose pages or repeats that only exist in the file
    try {
      (await readBackupList()).forEach(fp => { const lp = merged.get(fp.id); if (!lp || fp.updated > lp.updated) merged.set(fp.id, fp); });
      lastBkRules.forEach(fr => { const lr = mr.get(fr.id); if (!lr || fr.updated > lr.updated) mr.set(fr.id, fr); });
    } catch (_) {}
    const w = await bkHandle.createWritable();
    await w.write(JSON.stringify({ app: 'paper-diary', version: 1, exportedAt: new Date().toISOString(), pages: [...merged.values()], rules: [...mr.values()] }));

}

  if (!S.hadData) { S.hadData = true; saveSettings(); }

}

  const rulesNew = lastBkRules.some(r => { const l = rules.get(r.id); return !l || r.updated > l.updated; });
  if (!newer.length && rulesNew) { mergeRules(lastBkRules); catchUp(); if (!auto) toast('Repeating jobs updated from the backup file.'); return; }

  if (pages.size > 0) {
    const ok = await confirmDlg('Load newer data from your backup file?', `${newer.length} page${newer.length === 1 ? ' is' : 's are'} new or newer in "${bkHandle.name}". Load ${newer.length === 1 ? 'it' : 'them'} into this device?`, 'Load', false);
    if (!ok) return;

}
async function bkInit() {

}

/* =====================================================================
   PNG / PDF export (rendered from what is on screen)
   ===================================================================== */
function wrapText(g, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(par => {
    if (!par) { out.push(''); return; }
    let line = '';
    par.split(' ').forEach(word => {
      const test = line ? line + ' ' + word : word;
      if (g.measureText(test).width <= maxW || !line) {
        if (g.measureText(test).width > maxW) {           // very long word: break by characters
          let chunk = line ? line + ' ' : '';
          for (const ch of word) {
            if (g.measureText(chunk + ch).width > maxW && chunk) { out.push(chunk); chunk = ''; }
            chunk += ch;
          }
          line = chunk;
        } else line = test;
      } else { out.push(line); line = word; }
    });
    out.push(line);
  });
  return out;
}
function renderExport(inkOnly) {
  const sheet = els.sheet, r = sheet.getBoundingClientRect(), k = r.width / 1000, Hl = r.height / k;
  let sc = 2;
  while (1000 * sc * Hl * sc > 16e6 && sc > 0.5) sc -= 0.25;
  const c = document.createElement('canvas');
  c.width = Math.round(1000 * sc); c.height = Math.round(Hl * sc);
  const g = c.getContext('2d');
  g.scale(sc, sc);
  const cs = getComputedStyle(document.documentElement), V = n => cs.getPropertyValue(n).trim();
  if (!inkOnly) {
    g.fillStyle = V('--paper'); g.fillRect(0, 0, 1000, Hl);
    const top = (els.body.getBoundingClientRect().top - r.top) / k;
    g.strokeStyle = V('--line'); g.lineWidth = 1 / k;
    for (let y = top + 33.5 / k; y < Hl; y += 34 / k) { g.beginPath(); g.moveTo(0, y); g.lineTo(1000, y); g.stroke(); }
    const mx = ($('.margin').getBoundingClientRect().left - r.left) / k;
    g.strokeStyle = V('--margin'); g.globalAlpha = .75; g.lineWidth = 2 / k;
    g.beginPath(); g.moveTo(mx, 0); g.lineTo(mx, Hl); g.stroke(); g.globalAlpha = 1;
    sheet.querySelectorAll('[data-x]').forEach(el => {
      const rc = el.getBoundingClientRect();
      if (!rc.width || !rc.height || el.closest('[hidden]')) return;
      const st = getComputedStyle(el);
      const fs = parseFloat(st.fontSize) / k;
      const lh = (parseFloat(st.lineHeight) || parseFloat(st.fontSize) * 1.3) / k;
      g.font = `${st.fontStyle} ${st.fontWeight} ${fs}px ${st.fontFamily}`;
      g.fillStyle = st.color; g.textBaseline = 'alphabetic';
      const x = (rc.left - r.left) / k, y = (rc.top - r.top) / k, w = rc.width / k;
      const text = el instanceof HTMLTextAreaElement ? el.value : el.textContent.trim();
      const lines = wrapText(g, text, w);
      const struck = el.closest('.done');
      lines.forEach((ln, i) => {
        const by = y + i * lh + lh * 0.5 + fs * 0.33;
        g.fillText(ln, x, by);
        if (struck && ln) {
          g.strokeStyle = st.color; g.lineWidth = 2 / k;
          g.beginPath(); g.moveTo(x, by - fs * 0.3); g.lineTo(x + g.measureText(ln).width, by - fs * 0.3); g.stroke();
        }
      });
    });
    sheet.querySelectorAll('.task').forEach(row => {
      const rc = row.querySelector('.chk').getBoundingClientRect();
      const size = 22 / k, cx = (rc.left + rc.width / 2 - r.left) / k, cy = (rc.top + rc.height / 2 - r.top) / k;
      const wh = row.querySelector('.who');
      if (wh && wh.textContent) {
        const wr = wh.getBoundingClientRect(), ws = getComputedStyle(wh);
        g.font = `600 ${13 / k}px ${ws.fontFamily}`; g.fillStyle = V('--accent'); g.textBaseline = 'middle';
        g.fillText(wh.textContent, (wr.left - r.left) / k, (wr.top + wr.height / 2 - r.top) / k);
      }
      const done = row.classList.contains('done');
      g.lineWidth = 2 / k; g.strokeStyle = done ? V('--accent') : V('--ink'); g.fillStyle = V('--accent');
      g.beginPath(); g.roundRect ? g.roundRect(cx - size / 2, cy - size / 2, size, size, 6 / k) : g.rect(cx - size / 2, cy - size / 2, size, size);
      if (done) g.fill(); g.stroke();
      if (done) {
        g.strokeStyle = V('--accent-ink'); g.lineWidth = 2.6 / k; g.lineCap = 'round'; g.lineJoin = 'round';
        g.beginPath(); g.moveTo(cx - 5.5 / k, cy + .2 / k); g.lineTo(cx - 1.7 / k, cy + 4 / k); g.lineTo(cx + 5.5 / k, cy - 3.6 / k); g.stroke();
      }
    });
  }
  cur.strokes.forEach(s => pathStroke(g, s));
  return c;
}
function withLightTheme(fn) {
  const root = document.documentElement, prev = root.dataset.theme;
  root.dataset.theme = 'light';
  try { return fn(); } finally { root.dataset.theme = prev; }
}
const pageName = ext => {
  const list = pagesOn(cur.date), i = list.findIndex(p => p.id === cur.id);
  return `diary-${cur.date}${list.length > 1 ? '-page' + (i + 1) : ''}.${ext}`;
};
function exportPNG(inkOnly) {
  begin();
  try {
    const c = withLightTheme(() => renderExport(inkOnly));
    c.toBlob(b => {
      if (!b) { toast('Could not create the image. Try Add writing space less, or a new page.'); return; }
      download(b, inkOnly ? pageName('png').replace('.png', '-handwriting.png') : pageName('png'));
      toast('PNG saved');
    }, 'image/png');
  } catch (e) { toast('PNG export failed.'); }
}
function jpegBytes(c) {
  const bin = atob(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function buildPDF(pgs) {
  const enc = new TextEncoder(), chunks = [], offs = [];
  let len = 0;
  const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  put('%PDF-1.4\n');
  const n = pgs.length, total = 2 + 3 * n;
  offs[1] = len; put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2] = len; put(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${pgs.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] >>\nendobj\n`);
  pgs.forEach((p, i) => {
    const po = 3 + 3 * i, co = po + 1, io = po + 2;
    offs[po] = len; put(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
    const cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    offs[co] = len; put(`${co} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    offs[io] = len; put(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.d.length} >>\nstream\n`);
    put(p.d); put('\nendstream\nendobj\n');
  });
  const xr = len;
  let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  put(x); put(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}
function exportPDF() {
  begin();
  try {
    const jpgs = withLightTheme(() => {
      const c = renderExport(false), W = c.width, H = c.height;
      const sliceH = Math.round(W * 841.89 / 595.28), n = Math.max(1, Math.ceil(H / sliceH));
      const paper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
      const out = [];
      for (let i = 0; i < n; i++) {
        const s = document.createElement('canvas'); s.width = W; s.height = sliceH;
        const g = s.getContext('2d');
        g.fillStyle = paper; g.fillRect(0, 0, W, sliceH);
        const hh = Math.min(sliceH, H - i * sliceH);
        g.drawImage(c, 0, i * sliceH, W, hh, 0, 0, W, hh);
        out.push({ d: jpegBytes(s), w: W, h: sliceH });
      }
      return out;
    });
    download(buildPDF(jpgs), pageName('pdf'));
    toast('PDF saved');
  } catch (e) { toast('PDF export failed.'); }
}

/* =====================================================================
   More menu
   ===================================================================== */
function openMore() {
  begin();
  const dark = themeName() === 'dark';
  openModal(`<h2>My Diary</h2>
    <button class="mi" type="button" data-do="bk"><span>💾</span>Save &amp; backup</button>
    <button class="mi" type="button" data-do="inst"><span>📲</span>Add to Home Screen</button>
    <button class="mi" type="button" data-do="exp"><span>📤</span>Export Backup</button>
    <button class="mi" type="button" data-do="imp"><span>📥</span>Import Backup</button>
    <button class="mi" type="button" data-do="pdf"><span>📄</span>Export page as PDF</button>
    <button class="mi" type="button" data-do="png"><span>🖼️</span>Export page as PNG</button>
    <button class="mi" type="button" data-do="ink"><span>✍️</span>Export handwriting only (PNG)</button>
    <button class="mi" type="button" data-do="theme"><span>${dark ? '☀️' : '🌙'}</span>${dark ? 'Light mode' : 'Dark mode'}</button>
    <button class="mi danger" type="button" data-do="del"><span>🗑️</span>Delete this page</button>
    <p class="hint">Tip: on iPad, Text mode also turns Apple Pencil writing into typed text through Scribble (Settings › Apple Pencil).</p>
    <p class="hint">${Store.kind === 'idb' ? 'Saved on this device (IndexedDB). Works offline.' : 'Saved on this device (limited storage). Export backups regularly.'}</p>`);
  $('.panel', modal).addEventListener('click', async e => {
    const b = e.target.closest('[data-do]'); if (!b) return;
    const a = b.dataset.do;
    closeModal();
    if (a === 'bk') openBackup();
    else if (a === 'inst') openInstall();
    else if (a === 'exp') exportBackup();
    else if (a === 'imp') $('#fileIn').click();
    else if (a === 'pdf') exportPDF();
    else if (a === 'png') exportPNG(false);
    else if (a === 'ink') exportPNG(true);
    else if (a === 'theme') { S.theme = dark ? 'light' : 'dark'; saveSettings(); applyTheme(); }
    else if (a === 'del') {
      if (!(await confirmDlg('Delete this page?', 'Its notes, tasks and handwriting will be removed. This can’t be undone.', 'Delete page', true))) return;
      const id = cur.id, date = cur.date;
      cur.blocks.forEach(forgetOcc);
      pages.delete(id); dirty.delete(id);
      try { await Store.del(id); } catch (_) {}
      cur = null; openDate(date); toast('Page deleted');
    }
  });
}

/* =====================================================================
   Theme
   ===================================================================== */
function applyTheme() {
  const t = S.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  $('#themeColor').setAttribute('content', t === 'dark' ? '#0f1114' : '#c9d0cb');
  updateToolbar();
  if (cur) redrawInk();
}
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const h = () => { if (!S.theme) applyTheme(); };
  mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener && mq.addListener(h);
}

/* =====================================================================
   Global keys & lifecycle
   ===================================================================== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) { closeModal(); return; }
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  const typing = e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLInputElement;
  const k = e.key.toLowerCase();
  if (document.body.classList.contains('sumview')) return;
  if (k === 'k') { e.preventDefault(); openSearch(); }
  else if (!typing && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (!typing && k === 'y') { e.preventDefault(); redo(); }
});
let dayStamp = isoOf(new Date());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { begin(); if (S.autoSave) saveNow(); return; }
  if (isoOf(new Date()) !== dayStamp) { dayStamp = isoOf(new Date()); catchUp(); if (document.body.classList.contains('sumview')) closeSummary(); openDate(dayStamp); }
});
window.addEventListener('pagehide', () => { begin(); if (S.autoSave) saveNow(); });

/* =====================================================================
   Boot
   ===================================================================== */
window.addEventListener('error', e => { try { toast('Error: ' + (e.message || 'something went wrong')); } catch (_) {} });
(async function boot() {
  try {
  applyTheme();
  await Store.init();
  try {
    const all = await Store.all();
    all.forEach(p => { const q = sanitizePage(p); if (q) pages.set(q.id, q); });
  } catch (e) { toast('Could not read your saved diary.'); }
  try { await loadRules(); catchUp(); } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
  openDate(isoOf(new Date()));
  updateToolbar(); updateSaveState();
  if (Store.kind !== 'idb') toast('Using basic storage. Export backups regularly.');
  await bkInit();
  if (!pages.size && S.hadData && !bkHandle) askRestore();
  else if (pages.size && !bkHandle && Date.now() - S.lastBackup > 2 * 864e5) {
    setTimeout(() => toast(S.lastBackup ? `Last backup was ${fmtAgo(S.lastBackup)}.` : 'You have not backed up yet.', 'Back up', exportBackup), 3500);
  }
  } catch (err) {
    try { if (!cur) openDate(isoOf(new Date())); toast('Started with a problem: ' + (err && err.message)); } catch (_) {}
  }
})();
})();
</script>
